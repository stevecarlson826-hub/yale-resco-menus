<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yale ResCo Menus</title>
<style>
:root{--y:#00356b;--bg:#f5f7fa;--card:#fff;--line:#d9e0e7;--muted:#607080;--err:#a33}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#18222d}
header{background:var(--y);color:#fff;padding:18px 20px}h1{margin:0;font-size:24px}header p{margin:5px 0 0;opacity:.86}
.controls{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:12px;align-items:end;flex-wrap:wrap;position:sticky;top:0;z-index:2}
.field{display:flex;flex-direction:column;gap:5px}label{font-size:13px;font-weight:700}input,button{font:inherit;padding:9px 10px;border:1px solid #aeb9c4;border-radius:7px;background:#fff}
button{cursor:pointer;font-weight:700}.meal button.active{background:var(--y);color:#fff;border-color:var(--y)}
.status{padding:10px 18px;color:var(--muted);font-size:14px}.grid{padding:0 18px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px}.card h2{font-size:18px;margin:0 0 8px;color:var(--y)}
.meta{font-size:12px;color:var(--muted);margin-bottom:10px}.section{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--muted);margin:13px 0 5px;border-top:1px solid #edf0f3;padding-top:9px}
.item{padding:4px 0;line-height:1.3}.loading{color:var(--muted)}.error{color:var(--err);font-size:13px}a{color:var(--y)}.footer{padding:0 18px 28px;color:var(--muted);font-size:12px}
@media(max-width:600px){.controls{position:static}.grid{grid-template-columns:1fr;padding-left:10px;padding-right:10px}.status{padding-left:10px}}
</style></head><body>
<header><h1>Yale Residential College Menus</h1><p>Lunch & dinner across all 14 ResCos in one view</p></header>
<div class="controls"><div class="field"><label for="date">Date</label><input id="date" type="date"></div>
<div class="field"><label>Meal</label><div class="meal"><button id="breakfast">Breakfast</button> <button id="lunch" class="active">Lunch</button> <button id="dinner">Dinner</button> <button id="salad-bar">Salad Bar</button> <button id="desserts-daily-offerings">Desserts &amp; Daily Offerings</button></div></div>
<div class="field" style="flex:1;min-width:180px"><label for="search">Find a dish</label><input id="search" type="search" placeholder="salmon, chicken, tofu…"></div>
<button id="reload">Reload menus</button></div>
<div id="status" class="status">Loading…</div><main id="grid" class="grid"></main>
<div class="footer">Data source: Yale Hospitality / Nutrislice. Menus can change; Nutrislice remains the authoritative source.</div>
<script>
const colleges=[["Benjamin Franklin","benjamin-franklin-college"],["Berkeley","berkeley-college"],["Branford","branford-college"],["Davenport","davenport-college"],["Ezra Stiles","ezra-stiles-college"],["Grace Hopper","hopper-college"],["Jonathan Edwards","jonathan-edwards-college"],["Morse","morse-college"],["Pauli Murray","pauli-murray-college"],["Pierson","pierson-college"],["Saybrook","saybrook-college"],["Silliman","silliman-college"],["Timothy Dwight","timothy-dwight-college"],["Trumbull","trumbull-college"]];
let meal="lunch",allData={};const $=s=>document.querySelector(s),dateEl=$("#date"),grid=$("#grid"),status=$("#status"),search=$("#search");
function localISODate(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}dateEl.value=localISODate();
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function normalize(day){if(!day)return[];let section="Menu",out=[];for(const x of(day.menu_items||[])){if(x.is_section_title||x.is_station_header){section=(x.text||x.station_name||x.food?.name||"Menu").trim()||"Menu";continue}const name=(x.food?.name||x.text||"").trim();if(name)out.push({section,name,desc:(x.food?.description||"").trim()})}return out}
async function getCollege(slug,date){const r=await fetch(`/api/menu?slug=${encodeURIComponent(slug)}&meal=${meal}&date=${date}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json();const day=(j.days||[]).find(x=>x.date===date);return normalize(day)}
function render(){const q=search.value.trim().toLowerCase();grid.innerHTML="";for(const[name,slug]of colleges){const rec=allData[slug],card=document.createElement("section");card.className="card";let body="";
if(rec?.error)body=`<div class="error">Could not load this menu.</div>`;else if(!rec)body=`<div class="loading">Loading…</div>`;else{const items=rec.items.filter(x=>!q||(x.name+" "+x.section+" "+x.desc).toLowerCase().includes(q));if(!items.length)body=`<div class="loading">${q?"No matching dishes.":"No menu items published for this meal/date."}</div>`;else{let last=null;for(const x of items){if(x.section!==last){body+=`<div class="section">${esc(x.section)}</div>`;last=x.section}body+=`<div class="item">${esc(x.name)}</div>`}}body+=`<div class="meta" style="margin-top:12px"><a target="_blank" rel="noopener" href="https://yalehospitality.nutrislice.com/menu/${slug}">Official menu ↗</a></div>`}
card.innerHTML=`<h2>${esc(name)}</h2><div class="meta">${meal[0].toUpperCase()+meal.slice(1)} · ${esc(dateEl.value)}</div>${body}`;grid.appendChild(card)}}
async function load(){allData={};render();const date=dateEl.value;status.textContent=`Loading ${meal} menus for ${date}…`;let ok=0,bad=0;await Promise.all(colleges.map(async([,slug])=>{try{allData[slug]={items:await getCollege(slug,date)};ok++}catch(e){allData[slug]={error:String(e)};bad++}render()}));status.textContent=ok?`Loaded ${ok} of 14 live menus${bad?`; ${bad} could not be loaded`:""}.`:"Could not reach Nutrislice. Try Reload menus."}
["breakfast","lunch","dinner","salad-bar","desserts-daily-offerings"].forEach(m=>{$("#"+m).onclick=()=>{meal=m;["breakfast","lunch","dinner","salad-bar","desserts-daily-offerings"].forEach(x=>$("#"+x).classList.toggle("active",x===m));load()}});$("#reload").onclick=load;dateEl.onchange=load;search.oninput=render;load();
</script></body></html>
